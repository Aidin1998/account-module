name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Setup Go
        uses: actions/setup-go@v2
        with:
          go-version: '^1.20'
      - name: Install dependencies
        run: go mod download
      - name: Run go fmt
        run: go fmt ./...
      - name: Run go vet
        run: go vet ./...
      - name: Run linter
        run: golangci-lint run
      - name: Run tests
        run: go test ./... -coverprofile=coverage.out